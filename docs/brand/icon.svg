    <circle cx="132" cy="380" r="30" fill="#a5b4fc"/>
    <circle cx="256" cy="256" r="30" fill="#a5b4fc"/>
    <circle cx="318" cy="176" r="24" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="10"/>
    <circle cx="380" cy="132" r="62" fill="#3b2f4a"/>
    <circle cx="380" cy="132" r="38" fill="#fbbf24"/>
